<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WiFi Sentinel — Cloud Control Center. Persist, manage, and view your historical monitoring sessions on Cloud Firestore.">
    <title>WiFi Sentinel — Cloud Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header id="app-header">
        <div class="header-left">
            <a href="index.html" class="logo-link" title="Back to Dashboard">
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
                            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
                            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                            <line x1="12" y1="20" x2="12.01" y2="20"/>
                        </svg>
                    </div>
                    <h1>WiFi Sentinel</h1>
                </div>
            </a>
            <span class="subtitle">Cloud Console</span>
            <a href="index.html" class="back-dashboard-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
                <span>Dashboard</span>
            </a>
        </div>
        <div class="header-right">
            <div id="header-auth-section" class="header-auth">
                <!-- Dropdown / profile avatar loaded by cloud.js -->
                <div class="header-auth-loading">Checking status...</div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="dashboard" class="cloud-console-main">
        <!-- Cloud Control Center Card -->
        <section id="cloud-session-section" class="cloud-card">
            <div class="cloud-card-inner">
                <div class="cloud-card-header">
                    <div class="cloud-header-left">
                        <span class="cloud-icon-wrapper">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
                            </svg>
                        </span>
                        <div class="cloud-header-titles">
                            <h2>Cloud Control Center</h2>
                            <span class="cloud-header-subtitle">Real-time Firestore sync & session manager</span>
                        </div>
                    </div>
                    <div class="cloud-header-right">
                        <div id="cloud-status-badge" class="cloud-status-badge">
                            <span class="cloud-status-dot"></span>
                            <span id="cloud-status-text" class="status-text">Disconnected</span>
                        </div>
                    </div>
                </div>
                
                <div class="cloud-card-body" id="cloud-content">
                    <div class="cloud-loading">
                        <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="8"/>
                        </svg>
                        <span>Initializing Cloud Sentinel...</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <span>WiFi Sentinel v1.0</span>
        <span class="separator">·</span>
        <span>Cloud Persisted Mode</span>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/cloud.js"></script>
</body>
</html>
